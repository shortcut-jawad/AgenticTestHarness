# SonarQube Cloud path — integrated but inactive (see .github/workflows/build.yml).
# These placeholders belong to whoever's SonarQube Cloud org actually runs the
# scan; replace both with your own org/project key when you activate this path
# (SonarQube Cloud shows you the exact values when you create the project).
sonar.projectKey=CHANGE_ME_project_key
sonar.organization=CHANGE_ME_organization

# This is the name and version displayed in the SonarQube Cloud UI.
#sonar.projectName=AgenticTestHarness
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
