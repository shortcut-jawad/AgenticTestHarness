# Template for the `app-secrets` Secret that k8s/deployment.yaml reads from.
# DO NOT commit a real copy of this file with actual values.
#
# Usage:
#   cp k8s/secrets.example.yaml k8s/secrets.yaml   # (already gitignored)
#   # fill in real values below, then:
#   kubectl apply -f k8s/secrets.yaml
#
# Or create it imperatively without ever writing secrets to disk:
#   kubectl create secret generic app-secrets \
#     --from-literal=database_url='postgresql://...supabase pooler url...' \
#     --from-literal=direct_url='postgresql://...supabase session pooler url...' \
#     --from-literal=jwt_secret='...' \
#     --from-literal=gemini_api='...' \
#     --from-literal=groq_api='...' \
#     --from-literal=openai_base_url='https://api.openai.com/v1' \
#     --from-literal=openai_model='gpt-4.1-mini' \
#     --from-literal=openai_api='...' \
#     --from-literal=openai_api_1='...' \
#     --from-literal=openai_api_2='...' \
#     --from-literal=openai_model_1='gpt-4.1' \
#     --from-literal=openai_model_2='gpt-4.1-mini'
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  database_url: "postgresql://postgres.<project-ref>:<password>@<pooler-host>:6543/postgres?pgbouncer=true"
  direct_url: "postgresql://postgres.<project-ref>:<password>@<pooler-host>:5432/postgres"
  jwt_secret: "replace-with-a-long-random-secret"
  gemini_api: "replace-with-gemini-api-key"
  groq_api: "replace-with-groq-api-key"
  openai_base_url: "https://api.openai.com/v1"
  openai_model: "gpt-4.1-mini"
  openai_api: "replace-with-openai-api-key"
  openai_api_1: "replace-with-openai-api-key-1"
  openai_api_2: "replace-with-openai-api-key-2"
  openai_model_1: "gpt-4.1"
  openai_model_2: "gpt-4.1-mini"
