apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-deployment
spec:
  # Single-node cluster (see infra/aws/ — one free-tier EC2 instance), so this
  # is 2 replicas for basic redundancy/rolling updates rather than 3 spread
  # across 3 nodes — traffic is low enough that a single box is plenty, and
  # a 1 GiB-RAM micro instance has limited headroom for more than this.
  replicas: 2
  selector:
    matchLabels:
      app: nextjs-app
  template:
    metadata:
      labels:
        app: nextjs-app
    spec:
      initContainers:
        - name: init-uploads
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /app/uploads/agent-logs"]
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads

      containers:
        - name: nextjs-app
          image: shortcutjawad/nextjs-app:latest
          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"

            # Database (Supabase — same connection strings used in every other
            # environment; there is no in-cluster Postgres for this app)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database_url
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: direct_url

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt_secret
            - name: JWT_EXPIRES_DAYS
              value: "14"

            - name: GOOGLE_GEMINI_API
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: gemini_api
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: groq_api

            # OpenAI-compatible models + multi-key rotation (test harness)
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_base_url
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_model
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_api
            - name: OPENAI_API_KEY_1
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_api_1
                  optional: true
            - name: OPENAI_API_KEY_2
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_api_2
                  optional: true
            - name: OPENAI_MODEL_1
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_model_1
                  optional: true
            - name: OPENAI_MODEL_2
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_model_2
                  optional: true

          resources:
            # Sized for a free-tier t3.micro/t2.micro node (1 GiB RAM total) —
            # 2 replicas' limits must leave headroom for the OS and k3s's own
            # system pods (kube-system, containerd, etc.) on that same box.
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "400m"
              memory: "350Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads

      volumes:
        - name: uploads-volume
          emptyDir: {}
