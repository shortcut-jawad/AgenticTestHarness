apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nextjs-app
  template:
    metadata:
      labels:
        app: nextjs-app
    spec:
      # Prefer spreading the 3 replicas across the 3 k3s nodes (one per node)
      # instead of letting the scheduler stack them on a single box.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: nextjs-app
                topologyKey: kubernetes.io/hostname

      initContainers:
        - name: init-uploads
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /app/uploads/agent-logs"]
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads

      containers:
        - name: nextjs-app
          image: shortcutjawad/nextjs-app:latest
          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"

            # Database (Supabase — same connection strings used in every other
            # environment; there is no in-cluster Postgres for this app)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database_url
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: direct_url

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt_secret
            - name: JWT_EXPIRES_DAYS
              value: "14"

            - name: GOOGLE_GEMINI_API
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: gemini_api
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: groq_api

            # OpenAI-compatible models + multi-key rotation (test harness)
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_base_url
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_model
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_api
            - name: OPENAI_API_KEY_1
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_api_1
                  optional: true
            - name: OPENAI_API_KEY_2
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_api_2
                  optional: true
            - name: OPENAI_MODEL_1
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_model_1
                  optional: true
            - name: OPENAI_MODEL_2
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai_model_2
                  optional: true

          resources:
            # Sized for free-tier t3.micro/t2.micro nodes (1 GiB RAM each) —
            # 3 replicas total must fit alongside k3s's own system pods.
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads

      volumes:
        - name: uploads-volume
          emptyDir: {}
