# ─────────────────────────────────────────────────────────────────────────────
# cd.yml — Continuous Deployment (Path 2: Docker + Kubernetes, self-hosted)
#
# Production traffic is served by Vercel (Path 1), which deploys itself via
# its own GitHub App integration — that path is untouched by this file.
#
# This workflow deploys the Docker/Kubernetes path instead: whatever cluster
# the KUBE_CONFIG secret points at (a local kind cluster, the infra/aws/
# k3s cluster, or any other Kubernetes cluster). It's manual, not automatic
# on push, because Path 2 isn't live anywhere by default — trigger it
# yourself once you actually have a cluster's KUBE_CONFIG secret set.
#
# Jobs:
#   1. push-image      → Tag with git SHA + latest, push to Docker Hub
#   2. deploy          → kubectl apply to whichever cluster KUBE_CONFIG points at
#   3. health-check    → Verify deployment is live after rollout, roll back on failure
# ─────────────────────────────────────────────────────────────────────────────
name: CD - Deploy to Kubernetes

on:
  workflow_dispatch: {}

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/nextjs-app

jobs:
  # ── Job 1: Tag and push Docker image to Docker Hub ────────────────────────
  push-image:
    name: Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image (tagged with SHA + latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Two tags: SHA for traceability/rollback, latest for convenience
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to Kubernetes ───────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config   # Secure the credentials file

      - name: Apply K8s manifests (creates resources on first run, updates them after)
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Pin deployment to the exact SHA-tagged image
        # Done after apply so this works whether the Deployment was just
        # created (still on :latest) or already existed.
        run: |
          kubectl set image deployment/nextjs-deployment \
            nextjs-app=${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for rollout to complete
        # Blocks until all replicas are running the new image — or fails after 3 min
        run: kubectl rollout status deployment/nextjs-deployment --timeout=180s

      - name: Show pod distribution across nodes
        run: kubectl get pods -o wide -l app=nextjs-app

  # ── Job 3: Post-deployment health check ───────────────────────────────────
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for the Service to route to the new pods
        run: sleep 15

      - name: Check /api/health
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_URL }}/api/health)
          if [ "$RESPONSE" != "200" ]; then
            echo "Health check FAILED — got HTTP $RESPONSE from ${{ secrets.PRODUCTION_URL }}/api/health"
            exit 1
          fi
          echo "Health check PASSED — deployment of ${{ github.sha }} is live"

      - name: Setup kubectl (for rollback)
        if: failure()
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig (for rollback)
        if: failure()
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Health check failed — rolling back deployment"
          kubectl rollout undo deployment/nextjs-deployment
          kubectl rollout status deployment/nextjs-deployment --timeout=180s
