# ─────────────────────────────────────────────────────────────────────────────
# cd.yml — Continuous Deployment
#
# Target: a self-managed 3-node k3s cluster on AWS EC2 (see infra/aws/ for
# how the cluster is provisioned). k3s's built-in ServiceLB does the load
# balancing across the 3 nodes/replicas — there is no AWS ELB/ALB in the
# loop, so PRODUCTION_URL just needs to point at any one of the 3 node
# public IPs (or a DNS name you've pointed at them).
#
# Runs on: CI workflow completes successfully on main branch only
# Jobs:
#   1. push-image      → Tag with git SHA + latest, push to Docker Hub
#   2. deploy          → kubectl apply to the k3s cluster
#   3. health-check    → Verify deployment is live after rollout, roll back on failure
# ─────────────────────────────────────────────────────────────────────────────
name: CD - Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI"]           # Must match the `name:` field in ci.yml exactly
    types: [completed]
    branches: [main]            # Only deploy from main, not feature branches

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/nextjs-app

jobs:
  # ── Job 1: Tag and push Docker image to Docker Hub ────────────────────────
  push-image:
    name: Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      image-tag: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image (tagged with SHA + latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Two tags: SHA for traceability/rollback, latest for convenience
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to the k3s cluster ──────────────────────────────────────
  deploy:
    name: Deploy to k3s (AWS EC2)
    runs-on: ubuntu-latest
    needs: push-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config   # Secure the credentials file

      - name: Apply K8s manifests (creates resources on first run, updates them after)
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Pin deployment to the exact SHA-tagged image
        # Done after apply so this works whether the Deployment was just
        # created (still on :latest) or already existed.
        run: |
          kubectl set image deployment/nextjs-app \
            nextjs-app=${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}

      - name: Wait for rollout to complete
        # Blocks until all 3 replicas are running the new image — or fails after 3 min
        run: kubectl rollout status deployment/nextjs-app --timeout=180s

      - name: Show pod distribution across nodes
        run: kubectl get pods -o wide -l app=nextjs-app

  # ── Job 3: Post-deployment health check ───────────────────────────────────
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for ServiceLB to route to the new pods
        run: sleep 15

      - name: Check /api/health
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_URL }}/api/health)
          if [ "$RESPONSE" != "200" ]; then
            echo "Health check FAILED — got HTTP $RESPONSE from ${{ secrets.PRODUCTION_URL }}/api/health"
            exit 1
          fi
          echo "Health check PASSED — deployment of ${{ github.event.workflow_run.head_sha }} is live"

      - name: Setup kubectl (for rollback)
        if: failure()
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig (for rollback)
        if: failure()
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Health check failed — rolling back deployment"
          kubectl rollout undo deployment/nextjs-app
          kubectl rollout status deployment/nextjs-app --timeout=180s
