# app-secrets for the LOCAL kind demo only — points at the in-cluster
# postgres from postgres.yaml, not Supabase. Values here are throwaway
# demo credentials (not secrets in the real sense); still not committed
# to source outside this fixed demo file since it's specific to the
# local kind cluster (which is itself ephemeral).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  database_url: "postgresql://postgres:postgres@postgres-service:5432/agentic_test_harness"
  direct_url: "postgresql://postgres:postgres@postgres-service:5432/agentic_test_harness"
  jwt_secret: "local-demo-jwt-secret-not-for-production"
  gemini_api: "demo-not-configured"
  groq_api: "demo-not-configured"
  openai_base_url: "https://api.openai.com/v1"
  openai_model: "gpt-4.1-mini"
  openai_api: "demo-not-configured"
  openai_api_1: "demo-not-configured"
  openai_api_2: "demo-not-configured"
  openai_model_1: "gpt-4.1"
  openai_model_2: "gpt-4.1-mini"
