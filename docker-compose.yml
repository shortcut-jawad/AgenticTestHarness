# ─────────────────────────────────────────────────────────────────────────────
# Local development / demo stack
#
# Production runs on a 3-node k3s cluster on AWS EC2 (see k8s/ and
# infra/aws/) — load balancing across replicas is handled by k3s's built-in
# ServiceLB there, not by anything in this file. This compose file is for
# running the app locally against a throwaway Postgres instance only.
#
# Usage:
#   docker-compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL (local dev only) ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: agentic-test-harness-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-agentic_test_harness}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # Only bind to localhost — never expose DB publicly
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentic_test_harness}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Next.js app ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-test-harness-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # ── Database ────────────────────────────────────────────────────────────
      # For local demo: points to the db service above.
      # Set these in .env.local (or export them) to point at Supabase instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agentic_test_harness}}
      DIRECT_URL:   ${DIRECT_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agentic_test_harness}}

      # ── Auth ────────────────────────────────────────────────────────────────
      JWT_SECRET:       ${JWT_SECRET}
      JWT_EXPIRES_DAYS: ${JWT_EXPIRES_DAYS:-14}

      # ── AI providers ────────────────────────────────────────────────────────
      GOOGLE_GEMINI_API: ${GOOGLE_GEMINI_API}
      GROQ_API_KEY:      ${GROQ_API_KEY}
      OPENAI_API_KEY:    ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL:   ${OPENAI_BASE_URL:-}
      OPENAI_MODEL:      ${OPENAI_MODEL:-}
      OPENAI_API_KEY_1:  ${OPENAI_API_KEY_1:-}
      OPENAI_API_KEY_2:  ${OPENAI_API_KEY_2:-}
      OPENAI_MODEL_1:    ${OPENAI_MODEL_1:-}
      OPENAI_MODEL_2:    ${OPENAI_MODEL_2:-}

      NODE_ENV: production
    networks:
      - app-network
    volumes:
      - ./prisma:/app/prisma:ro    # Schema available without rebuild
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s            # Give entrypoint time to run migrations

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  pgdata:
  uploads:

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
